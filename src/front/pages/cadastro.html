<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro</title><link rel="stylesheet" href="../css/style.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"></head><body><main class="auth-page"><form class="auth-card" id="formCadastro"><a class="logo" href="index.html"><i class="fa-solid fa-house-chimney-window"></i> Maraú Stay</a><h1>Criar conta</h1><p>Cadastre-se como cliente ou anfitrião.</p><div id="msg"></div><input class="form-control" id="nome" placeholder="Nome completo" required><br><br><input class="form-control" id="email" type="email" placeholder="E-mail" required><br><br><input class="form-control" id="telefone" placeholder="Telefone"><br><br><input class="form-control" id="senha" type="password" placeholder="Senha" required><br><br><select class="form-control" id="tipo"><option value="CLIENTE">Cliente</option><option value="ANFITRIAO">Anfitrião</option><option value="ADMIN">Admin</option></select><br><br><button class="btn" type="submit" style="width:100%">Cadastrar</button><p style="margin-top:18px">Já tem conta? <a href="login.html" style="color:var(--primary);font-weight:700">Entrar</a></p></form></main><script src="../js/app.js"></script></body></html>

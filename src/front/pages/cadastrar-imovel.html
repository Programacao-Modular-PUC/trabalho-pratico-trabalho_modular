<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Anunciar imóvel</title><link rel="stylesheet" href="../css/style.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"></head><body><nav class="navbar"><a class="logo" href="index.html"><i class="fa-solid fa-house-chimney-window"></i> Maraú Stay</a><ul class="nav-links"><li><a href="index.html">Início</a></li><li><a href="hospedagem.html">Hospedagens</a></li><li><a href="cadastrar-imovel.html">Anunciar imóvel</a></li><li><a href="sobre.html">Sobre</a></li><li><a href="contato.html">Contato</a></li></ul><div class="user-area" id="userArea"></div></nav><section class="page-hero"><div><h1>Anunciar imóvel</h1><p>Cadastre apartamento, casa, pousada ou quarto no banco de dados.</p></div></section><section class="container"><form class="table-card" id="formImovel"><div id="msg"></div><div class="form-grid"><input class="form-control full" id="titulo" placeholder="Título do imóvel" required><textarea class="form-control full" id="descricao" placeholder="Descrição completa"></textarea><input class="form-control" id="cidade" placeholder="Cidade" required><input class="form-control" id="bairro" placeholder="Bairro"><input class="form-control full" id="endereco" placeholder="Endereço"><input class="form-control full" id="imagemUrl" placeholder="URL da imagem"><select class="form-control" id="tipoImovel"><option>Apartamento</option><option>Casa</option><option>Pousada</option><option>Quarto</option></select><input class="form-control" id="precoNoite" type="number" step="0.01" placeholder="Preço por noite" required><input class="form-control" id="quartos" type="number" placeholder="Quartos" required><input class="form-control" id="banheiros" type="number" placeholder="Banheiros" required><input class="form-control" id="camas" type="number" placeholder="Camas" required><input class="form-control" id="hospedes" type="number" placeholder="Capacidade de hóspedes" required></div><div class="check-row"><label><input type="checkbox" id="wifi"> Wi-fi</label><label><input type="checkbox" id="piscina"> Piscina</label><label><input type="checkbox" id="arCondicionado"> Ar-condicionado</label><label><input type="checkbox" id="estacionamento"> Estacionamento</label><label><input type="checkbox" id="petFriendly"> Aceita pet</label></div><button class="btn" type="submit">Salvar imóvel</button></form></section><footer><p>© 2026 - Maraú Stay | Sistema de hospedagens com Java + SQL</p></footer><script src="../js/app.js"></script></body></html>
